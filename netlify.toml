# Netlify deployment config for ShadowVault Protocol
#
# REQUIRED for order book + AI + /api on production:
#   Site → Environment variables → VITE_API_URL = https://YOUR-RAILWAY-API.up.railway.app (no trailing slash)
#   Prebuild writes FRONTEND/MAINDEX/public/_redirects to proxy /api/* and /V2/* to that host (same-origin in browser).
#   Redeploy after changing the variable.
#
[build]
  base = "FRONTEND/MAINDEX"
  command = "npm run build"
  publish = "dist"
